# Publica la app en GitHub Pages en cada push a main.
# Los valores de Microsoft 365 van en Settings > Secrets and variables > Actions > Variables.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_TENANT_ID: ${{ vars.VITE_TENANT_ID }}
          VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID }}
          VITE_SHAREPOINT_SITE: ${{ vars.VITE_SHAREPOINT_SITE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
